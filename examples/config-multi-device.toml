# Example Configuration: Multi-Device Setup
# Demonstrates connecting to multiple PLCs and a robot arm

[server]
rpc_port = 8080
http_port = 8081

[logging]
level = "info"
daily_rotation = true

# ==================== PLC Device 1 - Production Line Controller ====================
[[devices]]
id = "plc-production"
type = "plc"
address = "192.168.1.10"
port = 502
unit_id = 1
addressing_mode = "zero_based"
byte_order = "big_endian"
tcp_nodelay = true
max_concurrent_ops = 5
heartbeat_interval_sec = 15

# Signal group: Production line status
[[devices.signal_groups]]
name = "line_status"
description = "Production line control and monitoring"
register_address = "h0"
register_count = 3

[[devices.signal_groups.fields]]
name = "line_speed"
data_type = "U16"
offset = 0

[[devices.signal_groups.fields]]
name = "line_status"
data_type = "U16"
offset = 1

[[devices.signal_groups.fields]]
name = "emergency_stop"
data_type = "Bool"
offset = 2

# Signal group: Production counters
[[devices.signal_groups]]
name = "production_counters"
description = "Product count and statistics"
register_address = "h10"
register_count = 4

[[devices.signal_groups.fields]]
name = "product_count"
data_type = "U32"
offset = 0

[[devices.signal_groups.fields]]
name = "reject_count"
data_type = "U32"
offset = 2

# ==================== PLC Device 2 - Quality Control ====================
[[devices]]
id = "plc-quality"
type = "plc"
address = "192.168.1.11"
port = 502
unit_id = 1
addressing_mode = "zero_based"
byte_order = "big_endian"
tcp_nodelay = true
max_concurrent_ops = 3
heartbeat_interval_sec = 20

# Signal group: Quality inspection
[[devices.signal_groups]]
name = "quality_inspection"
description = "Quality inspection and calibration"
register_address = "h0"
register_count = 5

[[devices.signal_groups.fields]]
name = "inspection_result"
data_type = "U16"
offset = 0

[[devices.signal_groups.fields]]
name = "reject_count"
data_type = "U16"
offset = 1

[[devices.signal_groups.fields]]
name = "calibration_factor"
data_type = "F32"
offset = 2

[[devices.signal_groups.fields]]
name = "inspection_active"
data_type = "Bool"
offset = 4

# ==================== Robot Arm - 6-Axis Manipulator ====================
[[devices]]
id = "robot-arm-1"
type = "robot_arm"
address = "192.168.1.20"
port = 502
unit_id = 1
addressing_mode = "zero_based"
byte_order = "little_endian"
tcp_nodelay = true
max_concurrent_ops = 2
heartbeat_interval_sec = 10

# Signal group: Robot position
[[devices.signal_groups]]
name = "robot_position"
description = "6-axis robot position and gripper state"
register_address = "h100"
register_count = 7

[[devices.signal_groups.fields]]
name = "axis_x"
data_type = "F32"
offset = 0

[[devices.signal_groups.fields]]
name = "axis_y"
data_type = "F32"
offset = 2

[[devices.signal_groups.fields]]
name = "axis_z"
data_type = "F32"
offset = 4

[[devices.signal_groups.fields]]
name = "gripper_state"
data_type = "U16"
offset = 6

# Signal group: Robot commands (coils)
[[devices.signal_groups]]
name = "robot_commands"
description = "Robot movement and control commands"
register_address = "c0"
register_count = 2

[[devices.signal_groups.fields]]
name = "move_command"
data_type = "Bool"
offset = 0

[[devices.signal_groups.fields]]
name = "gripper_command"
data_type = "Bool"
offset = 1