# Example Configuration: Single PLC Device
# Copy this file to config.toml and modify as needed

[server]
# JSON-RPC server port
rpc_port = 8080

# HTTP management API port
http_port = 8081

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log file path (optional, defaults to stdout)
# file = "/var/log/roboplc-middleware.log"

# Rotate logs daily
daily_rotation = true

# Single PLC device configuration
[[devices]]
id = "plc-main"
type = "plc"
address = "192.168.1.100"
port = 502
unit_id = 1

# Addressing mode: "zero_based" (0-based) or "one_based" (1-based)
addressing_mode = "zero_based"

# Byte order for 32-bit values: "big_endian", "little_endian", 
# "big_endian_byte_swap", "little_endian_byte_swap"
byte_order = "big_endian"

# TCP_NODELAY option for lower latency
tcp_nodelay = true

# Maximum concurrent Modbus operations
max_concurrent_ops = 3

# Heartbeat interval in seconds
heartbeat_interval_sec = 30

# Signal group 1: Motor control registers
[[devices.signal_groups]]
name = "motor_control"
description = "Motor control and status registers"
register_address = "h100"
register_count = 3

[[devices.signal_groups.fields]]
name = "motor_speed"
data_type = "U16"
offset = 0

[[devices.signal_groups.fields]]
name = "motor_status"
data_type = "U16"
offset = 1

[[devices.signal_groups.fields]]
name = "motor_direction"
data_type = "Bool"
offset = 2

# Signal group 2: Sensor readings
[[devices.signal_groups]]
name = "sensor_readings"
description = "Temperature and pressure sensors"
register_address = "h200"
register_count = 4

[[devices.signal_groups.fields]]
name = "temperature"
data_type = "I16"
offset = 0

[[devices.signal_groups.fields]]
name = "pressure"
data_type = "F32"
offset = 2

# Signal group 3: Control commands (coils)
[[devices.signal_groups]]
name = "control_commands"
description = "Start/stop and other commands"
register_address = "c0"
register_count = 1

[[devices.signal_groups.fields]]
name = "run_command"
data_type = "Bool"
offset = 0