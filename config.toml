[server]
rpc_port = 8080
http_port = 8081

[logging]
level = "info"
file = ""
daily_rotation = false

# 配置连接到 Mock Modbus 服务器
[[devices]]
id = "Test-Dobot"
type = "robot_arm"
address = "192.168.201.1"
port = 502
unit_id = 1
addressing_mode = "zero_based"
byte_order = "little_endian_byte_swap"
tcp_nodelay = true
max_concurrent_ops = 3
heartbeat_interval_sec = 30

# 信号组 1: 电机控制
[[devices.signal_groups]]
name = "position_and_euler"
description = "x坐标值"
register_address = "h1024"
register_count = 24

[[devices.signal_groups.fields]]
name = "x_value"
data_type = "f64"
offset = 0

[[devices.signal_groups.fields]]
name = "y_value"
data_type = "f64"
offset = 4

[[devices.signal_groups.fields]]
name = "z_value"
data_type = "f64"
offset = 8

[[devices.signal_groups.fields]]
name = "rx"
data_type = "f64"
offset = 12

[[devices.signal_groups.fields]]
name = "ry"
data_type = "f64"
offset = 16

[[devices.signal_groups.fields]]
name = "rz"
data_type = "f64"
offset = 20

[[devices.signal_groups]]
name = "real_time_position_and_euler"
description = "实时位置和欧拉角"
register_address = "i1384"
register_count = 24

[[devices.signal_groups.fields]]
name = "x_value"
data_type = "f64"
offset = 0

[[devices.signal_groups.fields]]
name = "y_value"
data_type = "f64"
offset = 4

[[devices.signal_groups.fields]]
name = "z_value"
data_type = "f64"
offset = 8

[[devices.signal_groups.fields]]
name = "rx"
data_type = "f64"
offset = 12

[[devices.signal_groups.fields]]
name = "ry"
data_type = "f64"
offset = 16

[[devices.signal_groups.fields]]
name = "rz"
data_type = "f64"
offset = 20

#### 实际关节数据 #####
[[devices.signal_groups]]
name = "real_time_joint_position"
description = "实时位置和欧拉角"
register_address = "i1216" # 输入寄存器
register_count = 24

[[devices.signal_groups.fields]]
name = "J1"
data_type = "f64"
offset = 0

[[devices.signal_groups.fields]]
name = "J2"
data_type = "f64"
offset = 4

[[devices.signal_groups.fields]]
name = "J3"
data_type = "f64"
offset = 8

[[devices.signal_groups.fields]]
name = "J4"
data_type = "f64"
offset = 12

[[devices.signal_groups.fields]]
name = "J5"
data_type = "f64"
offset = 16

[[devices.signal_groups.fields]]
name = "J6"
data_type = "f64"
offset = 20

[[devices.signal_groups]]
name = "ready"
description = "机械臂准备就绪状态"
register_address = "h3095"
register_count = 1

[[devices.signal_groups.fields]]
name = "ready_status"
data_type = "u16"
offset = 0

[[devices.signal_groups]]
name = "start_signal"
description = "机械臂开始信号"
register_address = "c0"
register_count = 1

[[devices.signal_groups.fields]]
name = "start"
data_type = "bool"
offset = 0

[[devices.signal_groups]]
name = "stop_signal"
description = "机械臂开始信号"
register_address = "c1"
register_count = 1

[[devices.signal_groups.fields]]
name = "stop"
data_type = "bool"
offset = 0