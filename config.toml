[server]
rpc_port = 8080
http_port = 8081

[logging]
level = "info"
file = "/tmp/roboplc-middleware-test.log"
daily_rotation = false

# 配置连接到 Mock Modbus 服务器
[[devices]]
id = "Test-Dobot"
type = "robot_arm"
address = "120.79.214.231"
port = 502
unit_id = 1
addressing_mode = "zero_based"
byte_order = "little_endian_byte_swap"
tcp_nodelay = true
max_concurrent_ops = 3
heartbeat_interval_sec = 30

# 信号组 1: 电机控制
[[devices.signal_groups]]
name = "x"
description = "x坐标值"
register_address = "h1024"
register_count = 2

[[devices.signal_groups.fields]]
name = "x_value"
data_type = "f32"
offset = 0

